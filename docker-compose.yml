services:
  postgres:
    # Same build+image pattern as collector/webapp below -- FROM
    # postgres:16-alpine with db/init/ baked in (see docker/Dockerfile.postgres)
    # instead of bind-mounted, so this image is self-contained and published
    # to GHCR for a separate deployment to pull directly. `docker compose
    # build`/`up --build` still work as before, just building this instead of
    # pulling the stock postgres image.
    image: ghcr.io/altneu4/lacrosse-postgres:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lacrosse}
      POSTGRES_USER: ${POSTGRES_USER:-lacrosse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # Read by db/init/00-create-readonly-role.sh on first initialization,
      # to provision the SELECT-only role the webapp service below connects
      # with. Runs before the restore script below -- a restored backup's
      # GRANT statements reference this role, which must already exist.
      # Left optional here (unlike the webapp service's own required check)
      # so a deployment that never runs the webapp doesn't need this set.
      WEBAPP_DB_USER: ${WEBAPP_DB_USER:-lacrosse_readonly}
      WEBAPP_DB_PASSWORD: ${WEBAPP_DB_PASSWORD:-}
      # Read by db/init/01-restore-from-backup.sh on first initialization.
      # If a backup is found at BACKUP_HOST_PATH, it's restored automatically
      # instead of starting empty. Set to "false" to always start empty.
      POSTGRES_AUTO_RESTORE_ON_INIT: ${POSTGRES_AUTO_RESTORE_ON_INIT:-true}
    volumes:
      # Named volume -- persists across `docker compose build`/`up --build`
      # and container recreation, and lives on Docker's own Linux-native
      # storage rather than a bind-mounted host path, which Postgres warns
      # against for its live data directory (fsync/locking semantics don't
      # always match on non-native filesystems). Only removed by an explicit
      # `docker compose down -v` or `docker volume rm`. If the volume is ever
      # lost anyway, 01-restore-from-backup.sh below recovers from the most
      # recent nightly backup automatically.
      - pgdata:/var/lib/postgresql/data
      # Read-only access to the same backup files the `backup` service
      # writes, so 01-restore-from-backup.sh can find the latest one.
      - ${BACKUP_HOST_PATH:?BACKUP_HOST_PATH must be set in .env}:/backups-restore:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lacrosse} -d ${POSTGRES_DB:-lacrosse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  collector:
    # `image:` names the result of `build:` below for local dev (`docker
    # compose build`/`up --build` still works exactly as before) and doubles
    # as the tag pushed to GHCR by .github/workflows/publish-images.yml, so a
    # separate deployment (another server, Kubernetes) can just `docker pull`
    # / reference this image instead of needing the source tree to build it.
    image: ghcr.io/altneu4/lacrosse-collector:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LACROSSE_EMAIL: ${LACROSSE_EMAIL:?LACROSSE_EMAIL must be set in .env}
      LACROSSE_PASSWORD: ${LACROSSE_PASSWORD:?LACROSSE_PASSWORD must be set in .env}
      # Passed as discrete pieces rather than a "postgresql://user:pass@host/db"
      # URI -- a URI requires percent-encoding special characters in the
      # password, which collector.py deliberately avoids by using
      # psycopg.connect() keyword arguments instead.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-lacrosse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-lacrosse}
      LACROSSE_TIMEZONE: ${LACROSSE_TIMEZONE:-UTC}
      COLLECTION_INTERVAL_MINUTES: ${COLLECTION_INTERVAL_MINUTES:-15}
      LACROSSE_INITIAL_LOOKBACK_MINUTES: ${LACROSSE_INITIAL_LOOKBACK_MINUTES:-60}
      LACROSSE_OVERLAP_MINUTES: ${LACROSSE_OVERLAP_MINUTES:-10}
      LACROSSE_LOCATION_INDEX: ${LACROSSE_LOCATION_INDEX:-}
      LACROSSE_BACKFILL_FULL_HISTORY: ${LACROSSE_BACKFILL_FULL_HISTORY:-false}
      LACROSSE_BACKFILL_START_DATE: ${LACROSSE_BACKFILL_START_DATE:-2000-01-01}
      LACROSSE_BACKFILL_CHUNK_DAYS: ${LACROSSE_BACKFILL_CHUNK_DAYS:-7}
      LACROSSE_BACKFILL_DELAY_SECONDS: ${LACROSSE_BACKFILL_DELAY_SECONDS:-30}
      LACROSSE_BACKFILL_STALL_LIMIT: ${LACROSSE_BACKFILL_STALL_LIMIT:-3}
    # Checks heartbeat.py's file, touched after every collection cycle
    # attempt (success or caught failure) -- catches the one thing the
    # try/except in main_loop() can't: a cycle that never returns at all
    # (hung call, deadlock). Note this only affects reported status here,
    # not restart behavior -- collector.py's own watchdog thread handles
    # actually restarting under plain Docker/Compose (see its docstring).
    # The same `python3 healthcheck.py` command becomes a Kubernetes
    # livenessProbe's exec command unchanged if this image runs there later.
    healthcheck:
      test: ["CMD", "python3", "healthcheck.py"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 5m

  # Nightly (by default) pg_dump backups to a separate volume, independent of
  # the live data volume. Schedule and retention are customizable via .env.
  backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    restart: unless-stopped
    # Runs as root. Tested running as the image's non-root "postgres" user
    # (70:70) and it failed with permission denied writing to the Windows
    # bind-mounted BACKUP_HOST_PATH -- Docker Desktop's bind-mount ownership
    # translation didn't cooperate. Staying root here since a working
    # backup matters more than this specific hardening.
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Bind mount (not a named volume) so backup files are directly browsable
      # on the host, separate from Docker's internal storage for pgdata --
      # point a separate backup/sync tool at this same path for off-site
      # redundancy.
      - ${BACKUP_HOST_PATH:?BACKUP_HOST_PATH must be set in .env}:/backups
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-lacrosse}
      POSTGRES_USER: ${POSTGRES_USER:-lacrosse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # Cron schedule (or @daily/@weekly/etc). Default: once a day.
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}

  # Read-only dashboard: pick sensors and a timeline, see a chart. Connects
  # to Postgres with the lacrosse_readonly role (see
  # db/init/00-create-readonly-role.sh) -- it can never modify collected
  # data, even if the app itself has a bug.
  webapp:
    # See the same note on the collector service above -- this is also built
    # and pushed to GHCR by .github/workflows/publish-images.yml.
    image: ghcr.io/altneu4/lacrosse-webapp:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.webapp
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Published on the host so it's reachable from other devices on your
    # LAN. No login is required in front of it yet -- fine for a home
    # network, but add one first (e.g. a reverse proxy with basic auth)
    # before exposing this port beyond your LAN (port forwarding, etc).
    ports:
      - "${WEBAPP_PORT:-8080}:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-lacrosse}
      WEBAPP_DB_USER: ${WEBAPP_DB_USER:-lacrosse_readonly}
      # Required here (unlike the optional default on the postgres service
      # above) -- the dashboard can't do anything useful without this role,
      # so fail fast with a clear message instead of a psycopg error.
      WEBAPP_DB_PASSWORD: ${WEBAPP_DB_PASSWORD:?WEBAPP_DB_PASSWORD must be set in .env to use the web dashboard}

volumes:
  pgdata:
