<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Crosse Weather Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1720;
    --panel: #1a2632;
    --border: #2c3b4a;
    --text: #e6edf3;
    --muted: #8b98a5;
    --accent: #4fa3e3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 600;
  }
  header p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 0.85rem;
  }
  #toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    align-items: flex-start;
  }
  .toolbar-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 160px;
  }
  .toolbar-group h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin: 0;
  }
  #sidebar-toggle {
    display: none;
    margin-left: auto;
    align-self: center;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
    gap: 6px;
  }
  main {
    display: flex;
    gap: 20px;
    padding: 20px 24px;
    align-items: flex-start;
  }
  #sidebar {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    width: 260px;
    flex-shrink: 0;
  }
  #sidebar h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin: 0 0 10px;
  }
  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .sidebar-header h2 { margin: 0 0 10px; }
  #sidebar-close { display: none; }
  #sidebar-backdrop { display: none; }
  .location-group { margin-bottom: 14px; }
  .location-group > summary {
    cursor: pointer;
    font-weight: 600;
    padding: 4px 0;
  }
  .device-group { margin: 4px 0 4px 12px; }
  .device-group > .device-name {
    font-size: 0.85rem;
    color: var(--muted);
    margin: 4px 0 2px;
  }
  .field-checkbox {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 2px 0 2px 12px;
    font-size: 0.85rem;
  }
  .field-checkbox input { accent-color: var(--accent); }
  .range-buttons {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .range-buttons button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.8rem;
  }
  .range-buttons button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #06131f;
    font-weight: 600;
  }
  .custom-range {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 8px;
  }
  .custom-range label {
    font-size: 0.75rem;
    color: var(--muted);
  }
  .custom-range input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 4px;
    padding: 4px 6px;
    font-size: 0.8rem;
  }
  .custom-range button {
    margin-top: 4px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.8rem;
  }
  .sidebar-select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 0.8rem;
  }
  .refresh-controls {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .refresh-controls .sidebar-select { flex: 1; }
  .refresh-controls button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.95rem;
    line-height: 1;
    flex-shrink: 0;
  }
  .refresh-controls button:hover { border-color: var(--accent); }
  #content {
    flex: 1;
    min-width: 320px;
  }
  #chart-container {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    height: 480px;
    position: relative;
  }
  #status {
    margin-top: 10px;
    font-size: 0.8rem;
    color: var(--muted);
  }
  #status.error { color: #e36f6f; }
  #empty-state {
    color: var(--muted);
    text-align: center;
    margin-top: 60px;
    font-size: 0.9rem;
  }

  /* Below this width, the sensor sidebar becomes an off-canvas drawer
     (toggled by #sidebar-toggle in the toolbar) instead of a permanent
     column, so the chart gets the full width on tablets/phones. The
     toolbar's own controls (Auto-Refresh/Timeline/Compare/Units) already
     wrap onto multiple rows via #toolbar's flex-wrap at any width -- no
     extra rule needed for that down to this breakpoint. */
  @media (max-width: 860px) {
    #sidebar-toggle { display: inline-flex; }

    #sidebar {
      position: fixed;
      top: 0;
      left: -100%;
      height: 100vh;
      width: 85vw;
      max-width: 320px;
      z-index: 100;
      border-radius: 0;
      overflow-y: auto;
      transition: left 0.25s ease;
      box-shadow: 2px 0 16px rgba(0, 0, 0, 0.4);
    }
    #sidebar.open { left: 0; }

    #sidebar-close {
      display: inline-flex;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
    }

    #sidebar-backdrop.visible {
      display: block;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 90;
    }
  }

  /* Below this width even a two-up toolbar row feels cramped -- each
     control group takes the full row instead of sharing one with a
     neighbor. */
  @media (max-width: 480px) {
    .toolbar-group { flex: 1 1 100%; min-width: 0; }
    #sidebar-toggle { margin-left: 0; width: 100%; justify-content: center; }
  }
</style>
</head>
<body>
<header>
  <h1>La Crosse Weather Dashboard</h1>
  <p>Select one or more sensors and a timeline to plot.</p>
</header>
<div id="toolbar">
  <div class="toolbar-group">
    <h2>Auto-Refresh</h2>
    <div class="refresh-controls">
      <select class="sidebar-select" id="auto-refresh-select">
        <option value="0">Off</option>
        <option value="1">1 min</option>
        <option value="5" selected>5 min</option>
        <option value="15">15 min</option>
        <option value="30">30 min</option>
      </select>
      <button id="refresh-now-button" title="Refresh now">&#8635;</button>
    </div>
  </div>

  <div class="toolbar-group">
    <h2>Timeline</h2>
    <div class="range-buttons" id="range-buttons">
      <button data-range="24h" class="active">24h</button>
      <button data-range="7d">7d</button>
      <button data-range="30d">30d</button>
      <button data-range="90d">90d</button>
    </div>
    <details class="custom-range-toggle">
      <summary style="cursor:pointer; font-size:0.8rem; color:var(--muted);">Custom range</summary>
      <div class="custom-range">
        <label>Start<input type="datetime-local" id="custom-start"></label>
        <label>End<input type="datetime-local" id="custom-end"></label>
        <button id="apply-custom-range">Apply</button>
      </div>
    </details>
  </div>

  <div class="toolbar-group">
    <h2>Compare To</h2>
    <select class="sidebar-select" id="compare-select">
      <option value="none">None</option>
      <option value="previous">Previous period</option>
      <option value="month">Same time, 1 month ago</option>
      <option value="year">Same time, 1 year ago</option>
    </select>
  </div>

  <div class="toolbar-group">
    <h2>Temperature Units</h2>
    <div class="range-buttons" id="temp-unit-buttons">
      <button data-unit="C" class="active">&deg;C</button>
      <button data-unit="F">&deg;F</button>
    </div>
  </div>

  <!-- Hidden on wide screens (see #sidebar-toggle in <style>); opens the
       sensor picker as a drawer on tablets/phones instead of it eating
       vertical space above the chart. -->
  <button id="sidebar-toggle">&#9776; Sensors</button>
</div>

<main>
  <div id="sidebar-backdrop"></div>
  <aside id="sidebar">
    <div class="sidebar-header">
      <h2>Sensors</h2>
      <button id="sidebar-close" aria-label="Close sensor list">&times;</button>
    </div>
    <div id="sensor-tree">Loading&hellip;</div>
  </aside>

  <section id="content">
    <div id="chart-container">
      <div id="empty-state">Select a sensor from the left to plot data.</div>
      <canvas id="chart" style="display:none;"></canvas>
    </div>
    <div id="status"></div>
  </section>
</main>

<script>
const COLORS = [
  "#4fa3e3", "#e3944f", "#7ce34f", "#e34f8f", "#c34fe3",
  "#e3d64f", "#4fe3c9", "#e35a4f", "#8f4fe3", "#4fe37c",
];

let currentRange = "24h";
let customStart = null;
let customEnd = null;
let tempUnit = "C"; // "C" or "F" -- only affects fields stored in degrees_celsius
let compareMode = "none"; // "none" | "previous" | "month" | "year"
let chart = null;
let allSeriesMeta = {}; // key "deviceId|field" -> { deviceName, locationName, field, unit }

const UNIT_LABELS = {
  degrees_celsius: "°C",
  degrees_fahrenheit: "°F",
  relative_humidity: "%RH",
  millibars: "mb",
  kilometers_per_hour: "km/h",
  inches: "in",
  degrees: "°",
};

function friendlyUnit(unit) {
  return UNIT_LABELS[unit] || unit || "";
}

// Only Celsius readings are converted; everything else (including fields
// the API already reports in Fahrenheit, like HeatIndex) passes through
// unchanged regardless of the toggle.
function displayUnitFor(rawUnit) {
  return rawUnit === "degrees_celsius" && tempUnit === "F" ? "degrees_fahrenheit" : rawUnit;
}

function convertValue(value, rawUnit) {
  if (rawUnit === "degrees_celsius" && tempUnit === "F") {
    return value * 9 / 5 + 32;
  }
  return value;
}

const statusEl = document.getElementById("status");
const emptyStateEl = document.getElementById("empty-state");
const canvasEl = document.getElementById("chart");

function setStatus(msg, isError) {
  statusEl.textContent = msg || "";
  statusEl.className = isError ? "error" : "";
}

function selectedSeriesKeys() {
  return Array.from(document.querySelectorAll(".field-checkbox input:checked")).map(el => el.dataset.key);
}

// Every control below changes state (selection, range, unit, compare mode)
// immediately, but the actual fetch+redraw is debounced through this rather
// than called directly. Each refreshChart() re-fetches *every* currently
// selected series, not just what just changed -- so checking N sensors one
// at a time without this would cost 1+2+...+N requests, not N, and could
// trip the dashboard's own rate limits on nothing but its own UI.
let refreshDebounceTimer = null;
function scheduleRefresh(delayMs = 1000) {
  clearTimeout(refreshDebounceTimer);
  refreshDebounceTimer = setTimeout(refreshChart, delayMs);
}

// Periodic background refresh, independent of the debounce above -- fires
// on a fixed schedule regardless of user interaction, so new readings the
// collector writes (every COLLECTION_INTERVAL_MINUTES, 15 by default) show
// up without needing to touch a control. Calls refreshChart() directly
// rather than through scheduleRefresh(), since there's no rapid-fire
// clicking to coalesce here -- just a plain timer tick.
let autoRefreshTimer = null;
function setAutoRefresh(minutes) {
  if (autoRefreshTimer) {
    clearInterval(autoRefreshTimer);
    autoRefreshTimer = null;
  }
  if (minutes > 0) {
    autoRefreshTimer = setInterval(refreshChart, minutes * 60 * 1000);
  }
}

async function loadDevices() {
  const treeEl = document.getElementById("sensor-tree");
  try {
    const res = await fetch("/api/devices");
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const locations = await res.json();

    if (locations.length === 0) {
      treeEl.innerHTML = '<p style="color:var(--muted); font-size:0.85rem;">No data collected yet.</p>';
      return;
    }

    treeEl.innerHTML = "";
    for (const loc of locations) {
      const details = document.createElement("details");
      details.className = "location-group";
      details.open = true;
      const summary = document.createElement("summary");
      summary.textContent = loc.name;
      details.appendChild(summary);

      for (const dev of loc.devices) {
        const devGroup = document.createElement("div");
        devGroup.className = "device-group";
        const devName = document.createElement("div");
        devName.className = "device-name";
        devName.textContent = dev.name + (dev.sensor_type ? ` (${dev.sensor_type})` : "");
        devGroup.appendChild(devName);

        for (const f of dev.fields) {
          const key = `${dev.id}|${f.field}`;
          allSeriesMeta[key] = {
            deviceName: dev.name,
            locationName: loc.name,
            field: f.field,
            unit: f.unit,
          };

          const wrap = document.createElement("label");
          wrap.className = "field-checkbox";
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.dataset.key = key;
          cb.dataset.deviceId = dev.id;
          cb.dataset.field = f.field;
          cb.addEventListener("change", () => scheduleRefresh());
          wrap.appendChild(cb);
          const labelText = document.createElement("span");
          labelText.textContent = f.field + (f.unit ? ` (${friendlyUnit(f.unit)})` : "");
          wrap.appendChild(labelText);
          devGroup.appendChild(wrap);
        }
        details.appendChild(devGroup);
      }
      treeEl.appendChild(details);
    }
  } catch (err) {
    treeEl.innerHTML = '<p style="color:#e36f6f; font-size:0.85rem;">Failed to load sensors.</p>';
    setStatus(`Failed to load sensor list: ${err.message}`, true);
  }
}

function rangeQueryParams() {
  if (customStart && customEnd) {
    return `start=${encodeURIComponent(customStart)}&end=${encodeURIComponent(customEnd)}`;
  }
  return `range=${encodeURIComponent(currentRange)}`;
}

const RANGE_DURATIONS_MS = {
  "24h": 24 * 60 * 60 * 1000,
  "7d": 7 * 24 * 60 * 60 * 1000,
  "30d": 30 * 24 * 60 * 60 * 1000,
  "90d": 90 * 24 * 60 * 60 * 1000,
};

// Mirrors how the backend resolves "current period" bounds (RANGE_PRESETS in
// app.py), so the comparison window below is computed from the same start/end
// the primary series actually used -- not a separate guess at it.
function getCurrentBounds() {
  if (customStart && customEnd) {
    return { start: new Date(customStart), end: new Date(customEnd) };
  }
  const end = new Date();
  const start = new Date(end.getTime() - RANGE_DURATIONS_MS[currentRange]);
  return { start, end };
}

// Returns the shifted {start, end} to fetch, plus offsetMs: the amount to
// ADD to each returned point's timestamp so it lands on the *current*
// period's x-axis, directly overlaid for visual comparison. offsetMs is
// computed as an actual millisecond difference rather than assumed from a
// fixed duration, so calendar shifts (a month/year isn't a fixed number of
// days) still align correctly.
function getComparisonBounds() {
  if (compareMode === "none") return null;
  const { start, end } = getCurrentBounds();

  if (compareMode === "previous") {
    const duration = end.getTime() - start.getTime();
    const compStart = new Date(start.getTime() - duration);
    return { start: compStart, end: new Date(start.getTime()), offsetMs: duration };
  }

  const shiftCalendar = (d) => {
    const copy = new Date(d.getTime());
    if (compareMode === "month") copy.setMonth(copy.getMonth() - 1);
    else if (compareMode === "year") copy.setFullYear(copy.getFullYear() - 1);
    return copy;
  };
  const compStart = shiftCalendar(start);
  const compEnd = shiftCalendar(end);
  return { start: compStart, end: compEnd, offsetMs: start.getTime() - compStart.getTime() };
}

const COMPARE_LABELS = {
  previous: "previous period",
  month: "1 month ago",
  year: "1 year ago",
};

function formatTick(value, spanMs) {
  const d = new Date(value);
  if (spanMs <= 26 * 60 * 60 * 1000) {
    return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }
  return d.toLocaleDateString([], { month: "short", day: "numeric" });
}

async function refreshChart() {
  const keys = selectedSeriesKeys();
  if (keys.length === 0) {
    emptyStateEl.style.display = "block";
    canvasEl.style.display = "none";
    if (chart) { chart.destroy(); chart = null; }
    setStatus("");
    return;
  }

  setStatus("Loading…");
  try {
    // device_id is the actual La Crosse device id, pulled from the
    // checkbox's dataset (not the display name) so the query is exact.
    const checkboxes = Array.from(document.querySelectorAll(".field-checkbox input:checked"));
    const fetches = checkboxes.map(async cb => {
      const key = cb.dataset.key;
      const deviceId = cb.dataset.deviceId;
      const field = cb.dataset.field;
      const url = `/api/readings?device_id=${encodeURIComponent(deviceId)}&field=${encodeURIComponent(field)}&${rangeQueryParams()}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status} for ${field}`);
      const data = await res.json();
      return { key, data };
    });

    const seriesResults = await Promise.all(fetches);

    // Group by *display* unit, not raw unit -- so a Celsius field converted
    // to Fahrenheit lands on the same axis as a field the API already
    // reports in Fahrenheit (e.g. HeatIndex), instead of getting its own.
    const displayUnits = [...new Set(seriesResults.map(r => displayUnitFor(r.data.unit) || "value"))];
    const scales = { x: {
      type: "linear",
      ticks: {
        color: "#8b98a5",
        callback: function(value) {
          const span = this.max - this.min;
          return formatTick(value, span);
        },
      },
      grid: { color: "#2c3b4a" },
    }};
    displayUnits.forEach((unit, i) => {
      scales[`y-${unit}`] = {
        type: "linear",
        position: i % 2 === 0 ? "left" : "right",
        title: { display: true, text: friendlyUnit(unit), color: "#8b98a5" },
        ticks: { color: "#8b98a5" },
        grid: { drawOnChartArea: i === 0, color: "#2c3b4a" },
      };
    });

    const datasets = seriesResults.map((r, i) => {
      const meta = allSeriesMeta[r.key];
      const rawUnit = r.data.unit || "value";
      const unit = displayUnitFor(rawUnit);
      return {
        label: `${meta.locationName} / ${meta.deviceName} / ${meta.field}${unit ? " (" + friendlyUnit(unit) + ")" : ""}`,
        data: r.data.points.map(p => ({ x: new Date(p.ts).getTime(), y: convertValue(p.value, rawUnit) })),
        borderColor: COLORS[i % COLORS.length],
        backgroundColor: COLORS[i % COLORS.length],
        yAxisID: `y-${unit}`,
        pointRadius: 0,
        borderWidth: 2,
        tension: 0.15,
      };
    });

    // Overlay a time-shifted comparison series per selected sensor, if
    // enabled. Fetched with explicit start/end (not range=) since the
    // window is calendar-shifted, then each point's timestamp is nudged by
    // offsetMs so it draws directly on top of the current period's x-axis
    // -- same color as its live counterpart, dashed, thinner.
    const comparisonBounds = getComparisonBounds();
    let comparisonResults = [];
    if (comparisonBounds) {
      const compareFetches = checkboxes.map(async (cb, i) => {
        const deviceId = cb.dataset.deviceId;
        const field = cb.dataset.field;
        const url = `/api/readings?device_id=${encodeURIComponent(deviceId)}&field=${encodeURIComponent(field)}` +
          `&start=${encodeURIComponent(comparisonBounds.start.toISOString())}` +
          `&end=${encodeURIComponent(comparisonBounds.end.toISOString())}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status} for ${field} (comparison)`);
        const data = await res.json();
        return { key: cb.dataset.key, data, colorIndex: i };
      });
      comparisonResults = await Promise.all(compareFetches);

      const compareLabel = COMPARE_LABELS[compareMode];
      for (const r of comparisonResults) {
        const meta = allSeriesMeta[r.key];
        const rawUnit = r.data.unit || "value";
        const unit = displayUnitFor(rawUnit);
        datasets.push({
          label: `${meta.locationName} / ${meta.deviceName} / ${meta.field} (${compareLabel})`,
          data: r.data.points.map(p => ({
            x: new Date(p.ts).getTime() + comparisonBounds.offsetMs,
            y: convertValue(p.value, rawUnit),
          })),
          borderColor: COLORS[r.colorIndex % COLORS.length],
          backgroundColor: COLORS[r.colorIndex % COLORS.length],
          yAxisID: `y-${unit}`,
          pointRadius: 0,
          borderWidth: 1.5,
          borderDash: [6, 4],
          tension: 0.15,
        });
      }
    }

    emptyStateEl.style.display = "none";
    canvasEl.style.display = "block";

    if (chart) {
      chart.data.datasets = datasets;
      chart.options.scales = scales;
      chart.update();
    } else {
      chart = new Chart(canvasEl.getContext("2d"), {
        type: "line",
        data: { datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          interaction: { mode: "nearest", axis: "x", intersect: false },
          plugins: {
            legend: { labels: { color: "#e6edf3", boxWidth: 12, font: { size: 11 } } },
            tooltip: { mode: "nearest", intersect: false },
          },
          scales,
        },
      });
    }

    const totalPoints = seriesResults.reduce((sum, r) => sum + r.data.points.length, 0) +
      comparisonResults.reduce((sum, r) => sum + r.data.points.length, 0);
    const compareNote = comparisonBounds ? ` (with ${COMPARE_LABELS[compareMode]} overlay)` : "";
    setStatus(`Updated ${new Date().toLocaleTimeString()} — ${totalPoints} point(s) across ${keys.length} series${compareNote}.`);
  } catch (err) {
    setStatus(`Failed to load readings: ${err.message}`, true);
  }
}

document.getElementById("range-buttons").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-range]");
  if (!btn) return;
  customStart = null;
  customEnd = null;
  currentRange = btn.dataset.range;
  document.querySelectorAll("#range-buttons button").forEach(b => b.classList.toggle("active", b === btn));
  scheduleRefresh();
});

document.getElementById("compare-select").addEventListener("change", (e) => {
  compareMode = e.target.value;
  scheduleRefresh();
});

document.getElementById("temp-unit-buttons").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-unit]");
  if (!btn) return;
  tempUnit = btn.dataset.unit;
  document.querySelectorAll("#temp-unit-buttons button").forEach(b => b.classList.toggle("active", b === btn));
  scheduleRefresh();
});

document.getElementById("apply-custom-range").addEventListener("click", () => {
  const s = document.getElementById("custom-start").value;
  const e = document.getElementById("custom-end").value;
  if (!s || !e) {
    setStatus("Pick both a start and end for a custom range.", true);
    return;
  }
  customStart = new Date(s).toISOString();
  customEnd = new Date(e).toISOString();
  document.querySelectorAll("#range-buttons button").forEach(b => b.classList.remove("active"));
  scheduleRefresh();
});

document.getElementById("auto-refresh-select").addEventListener("change", (e) => {
  setAutoRefresh(Number(e.target.value));
});

document.getElementById("refresh-now-button").addEventListener("click", () => {
  // Bypass the debounce entirely -- this is an explicit, deliberate request
  // for fresh data right now, not a rapid-fire selection to coalesce.
  clearTimeout(refreshDebounceTimer);
  refreshChart();
});

// Matches the <select>'s "selected" option (5 min) above.
setAutoRefresh(5);

// Sensor sidebar as an off-canvas drawer on narrow screens (see the
// #sidebar media query in <style>). These elements/listeners exist at any
// width, but only visibly do anything below that breakpoint -- the toggle
// button is hidden by CSS on wide screens, and toggling .open on #sidebar
// has no visual effect there since #sidebar isn't position:fixed yet.
const sidebarEl = document.getElementById("sidebar");
const sidebarBackdropEl = document.getElementById("sidebar-backdrop");

function openSidebar() {
  sidebarEl.classList.add("open");
  sidebarBackdropEl.classList.add("visible");
}
function closeSidebar() {
  sidebarEl.classList.remove("open");
  sidebarBackdropEl.classList.remove("visible");
}

document.getElementById("sidebar-toggle").addEventListener("click", openSidebar);
document.getElementById("sidebar-close").addEventListener("click", closeSidebar);
sidebarBackdropEl.addEventListener("click", closeSidebar);

loadDevices();
</script>
</body>
</html>
